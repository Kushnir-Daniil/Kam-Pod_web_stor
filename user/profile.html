<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профіль</title>
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>Профіль</h1>
            </div>
            <div class="header-right">
                <div class="coin-badge">
                    <img src="../img/coin1.png" alt="">
                    <span id="globalCoinBadge">—</span>
                    <small>монети</small>
                </div>
                <button type="button" class="settings-btn" id="settingsBtn">⚙</button>
            </div>
        </div>

        <!-- Картка користувача -->
        <div class="profile-user-card">
            <img src="../img/person.png" class="profile-avatar" alt="">
            <div class="profile-user-info">
                <h2 id="profileName">—</h2>
                <p class="profile-username-line">
                    <span id="profileUsername">—</span>
                    <span id="profileLocationSep" hidden> · </span>
                    <span id="profileLocation"></span>
                </p>
                <p id="profileEmail" class="profile-email">
                    <span id="profileEmailText">—</span>
                    <button type="button" id="copyEmailBtn" class="copy-btn" title="Скопіювати">⧉</button>
                </p>
                <span class="badge-novice" id="profileLevelBadge">НОВАЧОК</span>
            </div>
        </div>

        <!-- XP прогрес -->
        <div class="xp-card">
            <div class="xp-labels">
                <span id="xpCurrent">0 ХР</span>
                <span id="xpNext">—</span>
            </div>
            <div class="xp-bar-track">
                <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
            </div>
        </div>

        <!-- Щоденник пригод -->
        <a href="#" class="profile-row-card" id="diaryCard">
            <img src="../img/book1.png" class="row-card-icon row-card-icon--orange" alt="">
            <div class="row-card-body">
                <div class="row-card-title-line">
                    <strong>Щоденник пригод</strong>
                    <span class="tag-new" id="diaryNewTag" hidden>НОВЕ</span>
                    <span class="tag-badge" id="diaryBadgeTag" hidden></span>
                </div>
                <p id="diarySummary">0 спогадів · 0 міст</p>
            </div>
            <img src="../img/arrow.png" class="row-card-arrow" alt="">
        </a>

        <!-- Абонемент -->
        <button type="button" class="profile-row-card" id="subscriptionCard">
            <img src="../img/ticket.png" class="row-card-icon row-card-icon--orange" alt="">
            <div class="row-card-body">
                <strong>Придбати 3-денний абонемент</strong>
                <p>Грай у будь-який квест, будь-де</p>
            </div>
            <img src="../img/arrow.png" class="row-card-arrow" alt="">
        </button>

        <!-- Здобувай монети -->
        <p class="section-label">ЗДОБУВАЙ МОНЕТИ</p>
        <div class="earn-coins-row">
            <button type="button" class="earn-coin-box" id="giftSubBtn">
                <div class="earn-icon-circle earn-icon-circle--gift"><img src="../img/giftbox.png" alt=""></div>
                <span class="earn-badge">+50</span>
                <p>Подаруй абонемент</p>
            </button>
            <button type="button" class="earn-coin-box" id="suggestLocationBtn">
                <div class="earn-icon-circle earn-icon-circle--location"><img src="../img/Geopin.png" alt=""></div>
                <span class="earn-badge">+50</span>
                <p>Запропонуй локацію</p>
            </button>
        </div>

        <!-- Виклики -->
        <button type="button" class="profile-row-card" id="challengesCard">
            <img src="../img/Flag1.png" class="row-card-icon row-card-icon--purple" alt="">
            <div class="row-card-body">
                <strong>Виклики</strong>
                <p>Дивись, хто кинув тобі виклик і перевершив свій результат</p>
            </div>
            <img src="../img/arrow.png" class="row-card-arrow" alt="">
        </button>

        <!-- Ваш прогрес -->
        <p class="section-label">ВАШ ПРОГРЕС</p>
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-icon-circle stat-icon-circle--level"><span class="stat-icon-emoji">⭐</span></div>
                <strong id="statLevel">0</strong>
                <span>Рівень</span>
            </div>
            <div class="stat-box">
                <div class="stat-icon-circle stat-icon-circle--km"><img src="../img/stickman.png" alt=""></div>
                <strong id="statKm">0.0 км</strong>
                <span>Пройдено пішки</span>
            </div>
            <div class="stat-box">
                <div class="stat-icon-circle stat-icon-circle--places"><img src="../img/Geopin.png" alt=""></div>
                <strong id="statLocations">0</strong>
                <span>Місць відкрито</span>
            </div>
        </div>

        <!-- Досягнення -->
        <div class="section-label-row">
            <p class="section-label">ДОСЯГНЕННЯ</p>
            <button type="button" class="section-label-link" id="viewAllAchievementsBtn">Переглянути всі</button>
        </div>
        <div class="achievements-preview-row" id="achievementsPreview"></div>

        <button type="button" id="logoutBtn" class="btn-logout">Вийти</button>
    </div>

    <!-- Модалка налаштувань (редагування локації) -->
    <div class="modal-overlay" id="settingsModal" hidden>
        <div class="modal-card">
            <h3>Налаштування профілю</h3>
            <label class="modal-field">
                <span>Місто, країна</span>
                <input type="text" id="locationInput" placeholder="напр. Кам'янець-Подільський, Україна">
            </label>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelSettingsBtn">Скасувати</button>
                <button type="button" class="btn-logout" id="saveSettingsBtn">Зберегти</button>
            </div>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <script type="module" src="../shared/js/nav.js"></script>
    <script type="module" src="js/user.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
